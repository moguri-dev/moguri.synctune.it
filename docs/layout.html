<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#F4EFE9">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="https://moguri.synctune.it/assets/social-card.png">
  <meta property="og:image:alt" content="Moguri's mascot and wordmark: Power on your terms.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="icon" type="image/svg+xml" href="{{ROOT}}assets/favicon.svg">
  <link rel="icon" sizes="any" href="{{ROOT}}assets/favicon.ico">
  <link rel="apple-touch-icon" href="{{ROOT}}assets/apple-touch-icon.png">
  <link rel="preload" href="{{ROOT}}assets/fonts/Outfit-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="{{ROOT}}assets/fonts/WorkSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ROOT}}styles.css">
  <script src="{{ROOT}}app.js" defer></script>
  <title>{{TITLE}}</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{HEADER}}
  <main id="main" tabindex="-1" class="docs-layout shell">
    <aside class="docs-nav">{{NAVIGATION}}</aside>
    <article class="docs-article">
      <span class="status"><span class="beacon" aria-hidden="true"></span>{{STATUS}}</span>
      <h1>{{HEADING}}</h1>
      <p class="docs-lead">{{DESCRIPTION}}</p>
      {{SOURCE}}
      <div class="docs-content">{{CONTENT}}</div>
      <p class="docs-return"><a href="{{SECTION_HOME}}">Back to the {{SECTION_NAME}}</a></p>
    </article>
  </main>
  {{FOOTER}}
</body>
</html>
